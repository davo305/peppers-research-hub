<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Peppers Research Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0e0b;
      color: white;
      line-height: 1.6;
    }

    .hero {
      position: relative;
      min-height: 88vh;
      background:
        linear-gradient(
          rgba(0, 0, 0, 0.30),
          rgba(0, 0, 0, 0.82)
        ),
        url('Screenshot_20260814_132841_ChatGPT.jpg')
        center / cover no-repeat;

      display: flex;
      align-items: flex-end;
      justify-content: center;
      text-align: center;
      padding: 50px 20px;
    }

    .hero-content {
      max-width: 850px;
      width: 100%;
    }

    .brand-badge {
      display: inline-block;
      background: rgba(0, 0, 0, 0.78);
      border: 1px solid rgba(255,255,255,.2);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 10vw, 78px);
      line-height: 1;
      text-shadow: 0 4px 16px rgba(0,0,0,.9);
    }

    .tagline {
      margin: 18px 0 30px;
      font-size: 20px;
      color: #f1f1f1;
      text-shadow: 0 2px 8px #000;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-block;
      padding: 15px 24px;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-red {
      background: #d92b27;
    }

    .btn-green {
      background: #24733a;
    }

    .section {
      max-width: 950px;
      margin: auto;
      padding: 55px 20px;
    }

    .section-title {
      font-size: 32px;
      margin: 0 0 18px;
    }

    .card {
      background: #151915;
      border: 1px solid #272d27;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 28px rgba(0,0,0,.18);
    }

    .status {
      display: inline-block;
      background: #143d20;
      color: #83ff9f;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .mini-card {
      background: #151915;
      border: 1px solid #272d27;
      border-radius: 16px;
      padding: 22px;
    }

    .mini-card h3 {
      margin-top: 0;
      color: #ffffff;
    }

    .announcement {
      border-left: 4px solid #d92b27;
    }

    footer {
      border-top: 1px solid #232823;
      padding: 35px 20px;
      text-align: center;
      color: #888;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .hero {
        min-height: 82vh;
        background-position: center top;
        padding-bottom: 38px;
